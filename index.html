<html lang="es">
<head>

<title>Mis finanzas</title>
<style>
/* VOICE: igual a la app de Control de Obras: clara, de bolsillo, botones grandes.
   IDEA: la libreta de cuentas del mes en el celular: barra azul, anillo de presupuesto, mosaico de acciones.
   PICTURE: el anillo del presupuesto montado sobre la barra azul, con las cifras del mes al lado.
   COLOUR and TYPE: azul #1F3864, verde #6EA82E/#97C459 para ingresos y acciones, rojo para excesos; fuente del sistema.
   LAYOUT: barra azul, tarjeta flotante, KPIs 2x2, mosaico, listas en tarjetas, menú inferior fijo; máx. 760px. */
:root{color-scheme:light dark;
--bg:light-dark(#ECEFF3,#0A101B);--card:light-dark(#FFFFFF,#141E33);--line:light-dark(#CDD5DF,#2E3D5E);--line-2:light-dark(#B9C3CF,#3A4B70);--sunk:light-dark(#F4F6F9,#101A2C);--sombra:0 1px 2px rgb(16 24 40/.06),0 2px 6px rgb(16 24 40/.06);--fg:light-dark(#16233B,#E7ECF5);--muted:light-dark(#6B778C,#9AA8C2);
--navy:#1F3864;--navy-2:#2B4C85;--navy-soft:light-dark(#E6EEF9,#22335A);--navy-tx:light-dark(#1F3864,#C9D8F2);--head-sub:light-dark(#B5D4F4,#9DBAE6);
--green:light-dark(#6EA82E,#97C459);--green-tile:#97C459;--green-ink:#173404;--green-soft:light-dark(#EAF3DE,#21361A);--green-tx:light-dark(#2E5E12,#BFE39A);
--red:light-dark(#C62828,#FF7A70);--red-soft:light-dark(#FDE7E6,#3A1D1D);--amber-soft:light-dark(#FAEEDA,#412402);--amber-ink:light-dark(#633806,#FAC775);
--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
main{padding:14px 14px calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));background:var(--navy);color:#fff}
.barra.alta{position:relative;padding-bottom:48px}
.barra h1{font-size:19px;font-weight:600;margin:0;line-height:1.2}
.barra .sub{font-size:12.5px;color:var(--head-sub);margin-top:2px}
.titulos{flex:1}
.atras,.marca{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;border:0;color:#fff;font:inherit}
.atras{background:rgb(255 255 255/.14);cursor:pointer}.atras:active{transform:scale(.92)}
.marca{background:var(--green-tile)}.marca .ic{color:var(--green-ink)}
.sync{font-size:12px;text-align:center;padding:4px 10px;background:var(--green-soft);color:var(--green-tx)}
.barra.alta+.sync{display:none}.sync.off{background:var(--amber-soft);color:var(--amber-ink)}.sync.mal{background:var(--red-soft);color:var(--red)}
h2{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;margin:14px 2px 2px;color:var(--fg)}h2::after{content:"";flex:1;border-top:1px solid var(--line-2)}
.anillo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;margin-top:-52px;position:relative;z-index:6;box-shadow:0 6px 20px rgb(22 35 59/.12)}
.anillo svg{flex:none}.anillo .pista{stroke:var(--navy-soft)}.anillo .valor{stroke:var(--green);transition:stroke-dasharray .8s var(--ease)}
.anillo.over .valor{stroke:var(--red)}.anillo .pct{fill:var(--navy-tx);font-weight:700}
.anillo-txt{font-size:13px;color:var(--muted);line-height:1.45}
.anillo-txt b{display:block;font-size:22px;color:var(--navy-tx);font-weight:700;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sombra)}
.k-lab{font-size:12px;font-weight:600;color:var(--muted);padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}.k-val{font-size:20px;font-weight:700;color:var(--navy-tx);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-val.neg{color:var(--red)}.k-val.pos{color:var(--green-tx)}.k-sub{font-size:12px;color:var(--muted)}
.mosaico{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:100px;padding:16px;border-radius:16px;box-shadow:var(--sombra);border:0;background:var(--navy);color:#fff;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer;transition:transform .12s var(--ease)}
.tile:active{transform:scale(.96)}.tile .ic{width:28px;height:28px}
.tile.verde{background:var(--green-tile);color:var(--green-ink)}
.tile.claro{background:var(--card);color:var(--navy-tx);border:1px solid var(--line-2);box-shadow:var(--sombra)}
.tile.ancho{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;min-height:60px}
.tarjeta{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sombra);padding:14px 16px;color:inherit;font:inherit;text-align:left;transition:transform .15s var(--ease)}
button.tarjeta{cursor:pointer}button.tarjeta:active{transform:scale(.98)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-emp{display:inline-block;font-size:11px;font-weight:600;color:var(--green-tx);background:var(--green-soft);padding:2px 8px;border-radius:10px;margin-bottom:4px}
.t-nom{font-weight:600;color:var(--navy-tx)}.t-sub{font-size:13px;color:var(--muted);margin-top:2px}
.t-txt{font-size:13px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.monto{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.monto.pos{color:var(--green-tx)}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:12px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.datos>div{padding:9px 10px;border-left:1px solid var(--line)}.datos>div:first-child{border-left:0}
.datos.d2>div:nth-child(odd){border-left:0}.datos.d2>div:nth-child(n+3){border-top:1px solid var(--line)}
.datos.d2{grid-template-columns:repeat(2,minmax(0,1fr))}
.datos span{display:block;font-size:11px;color:var(--muted)}.datos b{font-size:14px;color:var(--navy-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.prog{height:8px;background:var(--navy-soft);border-radius:6px;overflow:hidden;margin-top:10px}
.prog>div{height:100%;background:var(--green);border-radius:6px;transition:width .6s var(--ease)}
.prog.over>div{background:var(--red)}
.t-pie{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--navy-soft);color:var(--navy-tx)}
.chip.win{background:var(--green-soft);color:var(--green-tx)}.chip.lost{background:var(--red-soft);color:var(--red)}
.cat{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}.cat:first-child{border-top:0;padding-top:2px}
.cat .prog{margin:0}.cat b{white-space:nowrap;font-variant-numeric:tabular-nums}
.dia{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted);margin:8px 2px -2px}.dia::after{content:"";flex:1;border-top:1px dashed var(--line-2)}
.lista{display:flex;flex-direction:column;gap:8px}
.vacio{color:var(--muted);text-align:center;padding:24px 10px;background:var(--card);border:1px dashed var(--line-2);border-radius:14px}
.nota{font-size:13px;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:16px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--card);color:var(--navy-tx);border:1px solid var(--line-2)}
.btn.peligro{background:none;color:var(--red);border:1px solid var(--red)}
.form{display:flex;flex-direction:column;gap:12px}
.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;font-size:16px;font-weight:400;color:var(--fg);background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;width:100%;min-height:48px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--navy-2);box-shadow:0 0 0 3px var(--navy-soft)}
button:focus-visible,a:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px}
.grande{font-size:28px;font-weight:700;text-align:center;min-height:64px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--navy-soft);padding:5px;border-radius:16px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;font-weight:700;color:var(--navy-tx);cursor:pointer}
.seg input:checked+span{background:var(--navy);color:#fff}
.seg label:last-child input:checked+span{background:var(--green-tile);color:var(--green-ink)}
.error{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.buscar{position:relative}.buscar .ic{position:absolute;left:13px;top:14px;color:var(--muted)}.buscar input{padding-left:40px}
.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:8;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line-2);border-radius:22px;padding:6px;box-shadow:0 8px 24px rgb(22 35 59/.16);max-width:740px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;font-size:11px;line-height:1.15;text-align:center;color:var(--muted);text-decoration:none;border-radius:16px}
.tabs a .ic{width:22px;height:22px}.tabs a.activa{color:var(--navy-tx);background:var(--navy-soft);font-weight:700;box-shadow:inset 0 0 0 1px var(--line-2)}
.dias{text-align:center;min-width:66px;padding:8px 6px;border-radius:14px;background:var(--green-soft);color:var(--green-tx);flex:none}
.dias b{display:block;font-size:26px;line-height:1}.dias span{font-size:11px;font-weight:600}
.dias.ojo{background:var(--amber-soft);color:var(--amber-ink)}.dias.mal{background:var(--red-soft);color:var(--red)}.dias.fin{background:var(--navy-soft);color:var(--navy-tx)}
.cli-main{display:block;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.mini{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);color:var(--navy-tx);font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}
.mini.verde{background:var(--green-tile);color:var(--green-ink);border-color:transparent}
.foto{width:100%;max-height:340px;object-fit:contain;border-radius:14px;background:var(--line)}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:20px;border:0;background:var(--green-tile);color:var(--green-ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer;width:100%}
.mic.on{background:var(--red);color:#fff;animation:late 1s infinite}@keyframes late{50%{opacity:.75}}
.mic .ic{width:26px;height:26px}
.cargando{display:flex;align-items:center;gap:10px;justify-content:center;padding:28px 10px;color:var(--navy-tx);font-weight:600}
.recs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.recs .mini{justify-content:flex-start;text-align:left;width:100%;font-weight:500}
.recs .mini.vencido{color:var(--muted);text-decoration:line-through}
.fotos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fotos .ft{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);padding:0;cursor:pointer}
.fotos .ft img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgb(0 0 0/.6);color:#fff;font:700 14px/26px system-ui;padding:0;cursor:pointer}
.agregar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px dashed var(--line-2);border-radius:12px;color:var(--navy-tx);font-weight:600;cursor:pointer;background:var(--card)}
.visor{position:fixed;inset:0;background:rgb(5 8 15/.94);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.visor[hidden]{display:none}.visor img{max-width:100%;max-height:100%;border-radius:8px}
.visor button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
.chipf{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}.chipf .ic{width:14px;height:14px}
.capa.grupo{z-index:35}
.capa{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto}
.capa[hidden]{display:none}.capa main{padding-bottom:40px}
.capa.baul{z-index:30}.capa.baul .barra{background:#16233B}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16233B;color:#fff;padding:9px 10px 9px 18px;border-radius:22px;font-size:14px;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast[hidden]{display:none}.toast button{background:rgb(255 255 255/.16);color:#fff;border:0;border-radius:14px;min-height:34px;padding:0 12px;font:inherit;font-weight:600}
@media(prefers-reduced-motion:no-preference){main{animation:entra .25s var(--ease)}@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media(max-width:380px){.datos{grid-template-columns:1fr 1fr}.k-val{font-size:18px}}
</style>
</head>

const EST_C=['Esperando respuesta','En negociación','Aceptó','No aceptó'];
const ABIERTA=['Esperando respuesta','En negociación'];
const LS='gastos-proyectos-v1';
let items=new Map(),coll=null,editing=null,undoFn=null,tTimer=0,view='inicio',q='',fEst='',fCli='';
let cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),1);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const mesTxt=d=>cap(d.toLocaleDateString('es-CO',{month:'long',year:'numeric'}));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const digits=v=>+(String(v||'').replace(/\D/g,''))||0;
const opts=(arr,sel)=>arr.map(o=>`<option${o===sel?' selected':''}>${esc(o)}</option>`).join('');
const all=k=>[...items.values()].filter(o=>o.kind===k);
const ut=p=>p.valor*(p.util||0)/100;
const antV=x=>Math.round((x.valor||0)*(x.ant||0)/100);
const antPend=p=>(p.estado==='Adjudicado'||p.estado==='En ejecución')&&p.ant>0&&!p.antRec;
const ultAnt=()=>{const l=[...all('cli'),...all('proy')].filter(x=>x.ant>0).sort((a,b)=>(b.creado||'').localeCompare(a.creado||''));return l.length?l[0].ant:''};
const dias=(a,b)=>a?Math.max(0,Math.round((new Date((b||today())+'T12:00')-new Date(a+'T12:00'))/864e5)):0;
const fcorta=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y};

/* ---------- guardado ---------- */
function setStatus(s){const el=$('#sync');el.className='sync'+(s==='db'?'':s==='local'?' off':' mal');
  el.textContent={db:'En línea · todo guardado en tu cuenta',local:'Guardado en este navegador',slow:'Sin conexión todavía · lo que ves puede no estar al día',err:'Se perdió la conexión · recarga la página'}[s]||''}
function loadLocal(){try{const a=JSON.parse(localStorage.getItem(LS)||'[]');items=new Map(a.map(o=>[o.id,o]))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify([...items.values()]))}catch(e){}}
function fail(e){toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio: borra movimientos antiguos':'No se pudo guardar. Revisa la conexión')}
async function put(o){items.set(o.id,o);render();if(coll){try{await coll.doc(o.id).set(o)}catch(e){fail(e)}}else saveLocal()}
async function del(id){items.delete(id);render();if(coll){try{await coll.doc(id).delete()}catch(e){fail(e)}}else saveLocal()}
function toast(msg,undo){$('#tMsg').textContent=msg;undoFn=undo||null;$('#tAct').hidden=!undo;$('#toast').hidden=false;clearTimeout(tTimer);tTimer=setTimeout(()=>{$('#toast').hidden=true;undoFn=null},undo?7000:2600)}

/* ---------- piezas ---------- */
function anillo(p){const C=2*Math.PI*34,v=Math.max(0,Math.min(1,p))*C;
  return `<svg width="84" height="84" viewBox="0 0 80 80"><circle class="pista" cx="40" cy="40" r="34" fill="none" stroke-width="8"/>${p>0?'':'<!--'}<circle class="valor" cx="40" cy="40" r="34" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${v.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 40 40)"/>${p>0?'':'-->'}<text class="pct" x="40" y="45" text-anchor="middle" font-size="15">${Math.round(p*100)}%</text></svg>`}
const kpi=(l,v,s,c='')=>`<div class="kpi"><div class="k-lab">${esc(l)}</div><div class="k-val ${c}">${esc(v)}</div>${s?`<div class="k-sub">${esc(s)}</div>`:''}</div>`;
function mes(){const mk=mkey(cur),movs=all('mov').filter(m=>(m.fecha||'').startsWith(mk));let inn=0,out=0;const by={};
  movs.forEach(m=>{if(m.tipo==='Ingreso')inn+=m.monto;else{out+=m.monto;by[m.categoria]=(by[m.categoria]||0)+m.monto}});
  return{movs,inn,out,by,pres:(items.get('config')||{}).presupuesto||0}}
function movCard(m){const ing=m.tipo==='Ingreso',pr=(items.get(m.proyecto)||{}).nombre||(items.get(m.grupo)||{}).nombre,nf=fotosDe(m).length;
  return `<button class="tarjeta fila" data-act="editM" data-id="${esc(m.id)}"><div><div class="t-nom">${esc(m.descripcion||m.categoria)}</div><div class="t-sub">${esc([m.descripcion?m.categoria:'',m.metodo,pr].filter(Boolean).join(' · '))}${nf?` · <span class="chipf">${ico('camara')}${nf}</span>`:''}</div></div><div class="monto${ing?' pos':''}">${ing?'+':'−'}${esc(money(m.monto))}</div></button>`}
function proyCard(p){const d=p.inicio?new Date(p.inicio+'T12:00'):null,est=p.estado;
  const cls=est==='Perdido'?' lost':(est==='Adjudicado'||est==='En ejecución'||est==='Terminado')?' win':'';
  return `<div class="tarjeta"${ACTIVOS.includes(est)?'':' style="opacity:.65"'}><button class="cli-main" data-act="editP" data-id="${esc(p.id)}">
  <div class="t-emp">${esc(p.empresa)}</div><div class="t-nom">${esc(p.nombre)}</div>
  ${p.objeto?`<div class="t-txt">${esc(p.objeto)}</div>`:''}${p.cliente?`<div class="t-sub">${esc(p.cliente)}</div>`:''}
  <div class="datos"><div><span>Valor</span><b>${esc(mcorto(p.valor))}</b></div><div><span>Ejecución</span><b>${p.meses?esc(p.meses)+' meses':'—'}</b></div><div><span>Utilidad${p.util?' '+esc(p.util)+'%':''}</span><b>${esc(mcorto(ut(p)))}</b></div></div>
  ${p.ant?`<div class="t-sub" style="margin-top:8px">Anticipo ${esc(p.ant)}%: <b style="color:var(--navy-tx)">${esc(mshort(antV(p)))}</b> · ${p.antRec?'recibido el '+esc(fcorta(p.antRec)):'pendiente'}</div>`:''}
  <div class="prog"><div style="width:${Math.max(0,Math.min(100,+p.prob||0))}%"></div></div>
  <div class="t-pie"><span class="chip${cls}">${esc(est)}</span><span>${esc(p.prob||0)}% probable</span><span>${d?'Inicia '+esc(d.toLocaleDateString('es-CO',{month:'short',year:'numeric'})):'Sin fecha de inicio'}</span></div></button>
  ${ACTIVOS.includes(est)?`<div class="acc">${antPend(p)?`<span class="nota">Anticipo por cobrar: <b>${esc(money(antV(p)))}</b></span>`:''}<span style="flex:1"></span><button class="mini" data-act="addR" data-pid="${esc(p.id)}">${ico('reloj')} Recordarme</button>${antPend(p)?`<button class="mini verde" data-act="antP" data-id="${esc(p.id)}">Recibí el anticipo</button>`:''}</div>`:''}${recsHtml(p)}</div>`}
const recsHtml=x=>(x.recs||[]).length?`<div class="recs">${x.recs.slice().sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).map(r=>`<button class="mini${r.fecha<today()?' vencido':''}" data-act="editR" data-pid="${esc(x.id)}" data-rid="${esc(r.id)}">${ico('reloj')} ${esc(cap(new Date(r.fecha+'T12:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'})))} ${esc(r.hora)} · ${esc(r.texto)}</button>`).join('')}</div>`:'';
function cliCard(c){
  const abierta=ABIERTA.includes(c.estado),n=dias(c.enviada,abierta?null:c.cerrada),tone=!abierta?'fin':n>21?'mal':n>7?'ojo':'';
  const tel=String(c.tel||'').replace(/\D/g,''),wa=tel?(tel.length===10?'57'+tel:tel):'';
  const chip=c.estado==='Aceptó'?' win':c.estado==='No aceptó'?' lost':'';
  return `<div class="tarjeta"><button class="cli-main" data-act="editC" data-id="${esc(c.id)}"><div class="fila" style="align-items:flex-start">
  <div><div class="t-emp">${esc(c.empresa)}</div><div class="t-nom">${esc(c.cliente)}</div>${c.que?`<div class="t-txt">${esc(c.que)}</div>`:''}</div>
  <div class="dias ${tone}"><b>${n}</b><span>${n===1?'día':'días'}${abierta?' pensando':''}</span></div></div>
  <div class="datos d2"><div><span>Cotizado</span><b>${c.valor?esc(mcorto(c.valor)):'—'}</b></div><div><span>Anticipo${c.ant?' '+esc(c.ant)+'%':''}</span><b>${c.ant?esc(mcorto(antV(c))):'—'}</b></div><div><span>Enviada</span><b>${esc(fcorta(c.enviada))||'—'}</b></div><div><span>Último contacto</span><b>${c.ultimo?(dias(c.ultimo)===0?'Hoy':'Hace '+dias(c.ultimo)+' d'):'—'}</b></div></div></button>
  <div class="acc"><span class="chip${chip}">${esc(c.estado)}</span><span style="flex:1"></span>
  ${abierta?`<button class="mini" data-act="segC" data-id="${esc(c.id)}">Hice seguimiento</button>`:''}
  ${wa?`<a class="mini" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`:''}
  ${abierta?`<button class="mini" data-act="addR" data-pid="${esc(c.id)}">${ico('reloj')} Recordarme</button>`:''}
  ${abierta?`<button class="mini verde" data-act="winC" data-id="${esc(c.id)}">Aceptó</button>`:''}</div>${recsHtml(c)}</div>`}
function vClientes(){
  const cs=all('cli'),ab=cs.filter(c=>ABIERTA.includes(c.estado)),cer=cs.filter(c=>!ABIERTA.includes(c.estado)),si=cer.filter(c=>c.estado==='Aceptó').length;
  header('Posibles clientes',ab.length?ab.length+(ab.length===1?' cotización esperando':' cotizaciones esperando'):'Cotizaciones enviadas',false);
  const prom=ab.length?Math.round(ab.reduce((s,c)=>s+dias(c.enviada),0)/ab.length):0;
  const l=cs.filter(c=>fCli==='todas'?true:fCli?c.estado===fCli:ABIERTA.includes(c.estado))
    .sort((a,b)=>(ABIERTA.includes(b.estado)-ABIERTA.includes(a.estado))||(a.enviada||'').localeCompare(b.enviada||''));
  return `<div class="kpis">${kpi('Esperando respuesta',ab.length+(ab.length===1?' cliente':' clientes'))}${kpi('Valor cotizado en espera',mshort(ab.reduce((s,c)=>s+(c.valor||0),0)))}
  ${kpi('Tiempo promedio pensando',prom+(prom===1?' día':' días'),ab.length?'la más antigua: '+Math.max(...ab.map(c=>dias(c.enviada)))+' días':'')}${kpi('Aceptadas',cer.length?Math.round(si/cer.length*100)+'%':'—',cer.length?si+' de '+cer.length+' respondidas':'aún sin respuestas','pos')}</div>
  <div class="mosaico"><button class="tile ancho" data-act="addC">${ico('sumar')}Nueva cotización enviada</button></div>
  <select id="fCli" aria-label="Filtrar"><option value="">Esperando respuesta y en negociación</option><option value="todas"${fCli==='todas'?' selected':''}>Todas</option>${opts(EST_C,fCli)}</select>
  <p class="nota">Verde: menos de una semana · amarillo: de 8 a 21 días · rojo: más de 3 semanas.</p>
  <div class="lista">${l.length?l.map(cliCard).join(''):vacio(cs.length?'No hay cotizaciones en ese estado.':'Anota aquí cada cotización que mandes y la app te cuenta cuántos días lleva el cliente pensando.')}</div>`}
const tilesIA=()=>`<button class="tile claro" data-act="dictar">${ico('mic')}Dictar</button><label class="tile claro">${ico('camara')}Foto de factura<input type="file" accept="image/*" class="fotoIn" hidden></label>`;
const vacio=t=>`<div class="vacio">${esc(t)}</div>`;

/* ---------- vistas ---------- */
function header(t,sub,alta,acc=''){$('#hTit').textContent=t;$('#hSub').textContent=sub;$('#barra').className='barra'+(alta?' alta':'');$('#hAcc').innerHTML=acc}
function vInicio(){
  {const n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1)}
  const {movs,inn,out,pres}=mes(),bal=inn-out,hoy=all('mov').filter(m=>m.fecha===today()&&m.tipo!=='Ingreso').reduce((s,m)=>s+m.monto,0);
  const act=all('proy').filter(p=>ACTIVOS.includes(p.estado)),uts=act.reduce((s,p)=>s+ut(p),0);
  header('Mis finanzas',mesTxt(cur),true);
  const p=pres?out/pres:(inn?out/inn:0);
  const ring=`<div class="anillo${p>1?' over':''}">${anillo(p)}<div class="anillo-txt"><span>Gastado este mes</span><b>${esc(money(out))}</b><span>${pres?(out>pres?'Te pasaste '+esc(money(out-pres))+' del presupuesto':'de '+esc(money(pres))+' · quedan '+esc(money(pres-out))):(inn?'de '+esc(money(inn))+' que entraron':'Pon tu presupuesto en Más')}</span></div></div>`;
  const ult=all('mov').sort((a,b)=>(b.fecha+b.creado).localeCompare(a.fecha+a.creado)).slice(0,4);
  const prox=act.sort((a,b)=>(a.inicio||'9').localeCompare(b.inicio||'9')).slice(0,2);
  return ring+`<div class="kpis">${kpi('Hoy',money(hoy),'en gastos')}${kpi('Balance del mes',money(bal),'ingresos menos gastos',bal<0?'neg':'')}${kpi('Ingresos del mes',money(inn),movs.filter(m=>m.tipo==='Ingreso').length+' registrados','pos')}${kpi('Utilidades esperadas',mshort(uts),act.length+(act.length===1?' contrato activo':' contratos activos'))}</div>
  ${(()=>{const pe=all('proy').filter(antPend);if(!pe.length)return'';const t=pe.reduce((s,p)=>s+antV(p),0);return `<button class="tarjeta fila" data-act="go" data-v="contratos"><div><div class="t-nom">Anticipos por cobrar: ${esc(mshort(t))}</div><div class="t-sub">${pe.length} ${pe.length===1?'contrato adjudicado':'contratos adjudicados'} sin anticipo recibido</div></div>${ico('plata')}</button>`})()}
  ${(()=>{const ab=all('cli').filter(c=>ABIERTA.includes(c.estado));if(!ab.length)return'';const mx=Math.max(...ab.map(c=>dias(c.enviada)));return `<button class="tarjeta fila" data-act="go" data-v="clientes"><div><div class="t-nom">${ab.length} ${ab.length===1?'cliente pensando':'clientes pensando'} una cotización</div><div class="t-sub">La más antigua lleva ${mx} ${mx===1?'día':'días'}</div></div>${ico('reloj')}</button>`})()}
  <div class="mosaico"><button class="tile" data-act="addG">${ico('menos')}Anotar gasto</button><button class="tile verde" data-act="addI">${ico('sumar')}Anotar ingreso</button>
  ${tilesIA()}<button class="tile claro" data-act="addP">${ico('obra')}Nuevo contrato</button><button class="tile claro" data-act="go" data-v="gastos">${ico('avance')}¿En qué se va la plata?</button></div>
  <h2>Últimos movimientos</h2><div class="lista">${ult.length?ult.map(movCard).join(''):vacio('Aún no has anotado nada. Empieza con “Anotar gasto”.')}</div>
  ${prox.length?`<h2>Contratos que vienen</h2><div class="lista">${prox.map(proyCard).join('')}</div>`:''}`}
function vGastos(){
  const {movs,inn,out,by,pres}=mes();
  header('Gastos del día a día',mesTxt(cur),false,`<button class="atras" data-act="mPrev" aria-label="Mes anterior">${ico('atras')}</button><button class="atras" data-act="mNext" aria-label="Mes siguiente">${ico('adel')}</button>`);
  const cs=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=cs.length?cs[0][1]:1;
  return `<div class="kpis">${kpi('Gastos',money(out),pres?Math.round(out/pres*100)+'% del presupuesto':'')}${kpi('Ingresos',money(inn),'','pos')}</div>
  ${pres?`<div class="prog${out>pres?' over':''}" style="margin:0"><div style="width:${Math.min(100,out/pres*100)}%"></div></div>`:''}
  <div class="mosaico"><button class="tile" data-act="addG">${ico('menos')}Anotar gasto</button><button class="tile verde" data-act="addI">${ico('sumar')}Anotar ingreso</button>${tilesIA()}</div>
  ${cs.length?`<h2>En qué se va la plata</h2><div class="tarjeta">${cs.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="prog"><div style="width:${(v/mx*100).toFixed(1)}%"></div></div><b>${esc(money(v))}</b></div>`).join('')}</div>`:''}
  ${seccionGrupos()}
  <h2>Movimientos</h2><div class="buscar">${ico('buscar')}<input id="q" type="search" placeholder="Buscar en este mes" aria-label="Buscar movimientos" value="${esc(q)}" autocomplete="off"></div>
  <div class="lista" id="movList">${listaMovs(movs)}</div>`}
function listaMovs(movs){
  const t=q.trim().toLowerCase(),pn=id=>(items.get(id)||{}).nombre||'';
  const l=movs.filter(m=>!t||[m.descripcion,m.categoria,m.metodo,pn(m.proyecto)].join(' ').toLowerCase().includes(t)).sort((a,b)=>(b.fecha+b.creado).localeCompare(a.fecha+a.creado));
  if(!l.length)return vacio(movs.length?'Nada coincide con la búsqueda.':'No hay movimientos en este mes.');
  let h='',last='';l.forEach(m=>{if(m.fecha!==last){last=m.fecha;h+=`<div class="dia">${esc(cap(new Date(m.fecha+'T12:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})))}</div>`}h+=movCard(m)});return h}
function vContratos(){
  const ps=all('proy'),act=ps.filter(p=>ACTIVOS.includes(p.estado));
  header('Contratos y proyectos',ps.length?act.length+(act.length===1?' activo':' activos')+' de '+ps.length:'Lo que viene',false);
  const l=ps.filter(p=>!fEst||p.estado===fEst).sort((a,b)=>(ACTIVOS.includes(b.estado)-ACTIVOS.includes(a.estado))||(a.inicio||'9').localeCompare(b.inicio||'9'));
  return `<div class="kpis">${kpi('Valor de contratos activos',mshort(act.reduce((s,p)=>s+p.valor,0)))}${kpi('Utilidades esperadas',mshort(act.reduce((s,p)=>s+ut(p),0)),'','pos')}
  ${kpi('Adjudicado y en ejecución',mshort(ps.filter(p=>p.estado==='Adjudicado'||p.estado==='En ejecución').reduce((s,p)=>s+p.valor,0)))}${kpi('Utilidad según probabilidad',mshort(act.reduce((s,p)=>s+ut(p)*(p.prob||0)/100,0)))}${kpi('Anticipos por cobrar',mshort(ps.filter(antPend).reduce((s,p)=>s+antV(p),0)),ps.filter(antPend).length+' por cobrar',ps.some(antPend)?'neg':'')}${kpi('Anticipos recibidos',mshort(ps.filter(p=>p.antRec).reduce((s,p)=>s+antV(p),0)),ps.filter(p=>p.antRec).length+' recibidos','pos')}</div>
  <div class="mosaico"><button class="tile ancho" data-act="addP">${ico('sumar')}Nuevo contrato o proyecto</button></div>
  <select id="fEst" aria-label="Filtrar por estado"><option value="">Todos los estados</option>${opts(ESTADOS.map(e=>e[0]),fEst)}</select>
  <div class="lista">${l.length?l.map(proyCard).join(''):vacio(ps.length?'No hay contratos en ese estado.':'Aquí van las licitaciones, formulaciones y diseños que vienen. Toca “Nuevo contrato o proyecto”.')}</div>`}
function vMas(){
  const pres=(items.get('config')||{}).presupuesto||0;
  header('Más','Ajustes y datos',false);
  return `<button class="tarjeta fila" data-act="budget"><div><div class="t-nom">Presupuesto mensual</div><div class="t-sub">${pres?esc(money(pres))+' al mes':'Sin definir'}</div></div>${ico('meta')}</button>
  ${gid()?`<button class="tarjeta fila" data-act="gConectar"><div><div class="t-nom">Google Calendar</div><div class="t-sub">${gTok&&Date.now()<gExp?'Conectado':'Listo · toca para conectar ahora'}</div></div>${ico('reloj')}</button>
  <button class="tarjeta fila" data-act="diario"><div><div class="t-nom">Recordatorio diario de gastos</div><div class="t-sub">${cfg().diario?'Todos los días a las '+esc(cfg().diario.hora):'Sin activar'}</div></div>${ico('reloj')}</button>`:''}
  <button class="tarjeta fila" data-act="gcfg"><div><div class="t-nom">${gid()?'Cambiar conexión con Google':'Conectar Google Calendar'}</div><div class="t-sub">${gid()?'ID de cliente guardado':'Pega aquí el ID de cliente de Google'}</div></div>${ico('llave')}</button>
  <button class="tarjeta fila" data-act="csvM"><div><div class="t-nom">Copiar movimientos</div><div class="t-sub">Para pegar en Excel</div></div>${ico('doc')}</button>
  <button class="tarjeta fila" data-act="csvP"><div><div class="t-nom">Copiar contratos</div><div class="t-sub">Para pegar en Excel</div></div>${ico('doc')}</button>
  <button class="tarjeta fila" data-act="csvC"><div><div class="t-nom">Copiar posibles clientes</div><div class="t-sub">Para pegar en Excel</div></div>${ico('doc')}</button>
  <p class="nota">${coll?'Tus datos se guardan en tu cuenta de Claude y los ves igual en el celular y el computador.':'Tus datos se guardan en este navegador. Para tenerlos en el celular y el computador a la vez, abre la versión de Claude.'}</p>`}

function render(){if(!$('#grupoV').hidden)renderGrupo();
  const v={inicio:vInicio,gastos:vGastos,contratos:vContratos,clientes:vClientes,mas:vMas}[view]||vInicio;
  const qf=document.activeElement&&document.activeElement.id==='q';
  $('#main').innerHTML=v();
  if(qf){const i=$('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  $('#tabs').innerHTML=[['inicio','Inicio','home'],['gastos','Gastos','plata'],['contratos','Contratos','obra'],['clientes','Posible cliente','cliente'],['mas','Más','mas']].map(([k,n,i])=>`<a href="#${k}" class="${k===view?'activa':''}">${ico(i)}${n}</a>`).join('');
}
function route(){view=['inicio','gastos','contratos','clientes','mas'].includes(location.hash.slice(1))?location.hash.slice(1):'inicio';render();window.scrollTo(0,0)}

/* ---------- formularios ---------- */
function movForm(m,tipo){
  const ps=all('proy').filter(p=>ACTIVOS.includes(p.estado)||p.id===m?.proyecto);

  <label class="campo">¿Cuánto?<input name="monto" id="fMonto" class="grande" inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${m&&m.monto?esc(m.monto.toLocaleString('es-CO')):''}"></label>
  <label class="campo">¿En qué?<select name="categoria" id="fCat">${opts(tipo==='Ingreso'?CAT_I:CAT_G,m?.categoria)}</select></label>

  <label class="campo">Grupo (ej. una obra que financias)<select name="grupo" id="fGrupo"><option value="">Sin grupo</option>${all('grupo').filter(g=>!g.cerrado||g.id===m?.grupo).map(g=>`<option value="${esc(g.id)}"${g.id===m?.grupo?' selected':''}>${esc(g.nombre)}</option>`).join('')}<option value="__nuevo">+ Crear grupo nuevo…</option></select></label>

  <div class="fila2"><label class="campo">Anticipo que pediste (%)<input name="ant" id="fAnt" type="number" inputmode="decimal" min="0" max="100" step="5" value="${esc(c?.ant??ultAnt())}"></label>

function budgetForm(){const v=(items.get('config')||{}).presupuesto||0;

function vEntryForm(o){return `<label class="campo">Título<input name="titulo" maxlength="120" value="${esc(o?.titulo||'')}"></label>
  <label class="campo">Monto (opcional)<input name="monto" id="fMonto" class="grande" inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${o&&o.monto?esc(o.monto.toLocaleString('es-CO')):''}"></label>

function vSetupForm(){return `<p class="nota">Para abrir el baúl, escribe esta palabra en el buscador de Gastos y dale Enter. No aparece en ninguna parte. Si la olvidas, lo que haya en el baúl no se puede recuperar.</p>
  <label class="campo">Palabra o frase secreta<input type="password" name="p1" autocomplete="new-password"></label><label class="campo">Repítela<input type="password" name="p2" autocomplete="new-password"></label>`}
const TIT={grupo:o=>o?'Editar grupo':'Nuevo grupo',recordar:o=>o?'Editar recordatorio':'Recordarme',gcfg:()=>'Google Calendar',diario:()=>'Recordatorio diario',dictar:()=>'Dictar',cli:o=>o?'Editar cotización':'Nueva cotización enviada',mov:o=>o?'Editar movimiento':'Anotar',proy:o=>o?'Editar contrato':'Nuevo contrato o proyecto',budget:()=>'Presupuesto mensual',ventry:o=>o?'Editar nota':'Nueva nota',vsetup:()=>'Crea tu palabra secreta',vchange:()=>'Cambiar palabra secreta'};
function openForm(kind,o,tipo,pre){
  editing={kind,o};tipo=o?.tipo||pre?.tipo||tipo||'Gasto';
  const body={grupo:()=>grupoForm(o),recordar:()=>recForm(o||pre),gcfg:gcfgForm,diario:diarioForm,dictar:dictarForm,cli:()=>cliForm(o||pre),mov:()=>movForm(o||pre,tipo),proy:()=>proyForm(o||pre),budget:budgetForm,ventry:()=>vEntryForm(o),vsetup:vSetupForm,vchange:vSetupForm}[kind]();
  $('#pTit').textContent=TIT[kind](o);
  const conDel=o||(kind==='diario'&&cfg().diario);
  $('#frm').innerHTML=body+`<div class="error" id="fErr" hidden></div><button class="btn">${kind==='dictar'?'Entender lo que dije':kind==='recordar'||kind==='diario'?'Guardar en Google Calendar':'Guardar'}</button>${conDel?'<button type="button" class="btn peligro" id="fDel">Eliminar</button>':''}`;
  $('#pane').hidden=false;$('#pane').scrollTop=0;
  const f=$('#fMonto')||$('#frm input:not([type=radio])');if(f&&kind!=='proy'&&!pre)f.focus();
  if(kind==='mov'||kind==='grupo')initFotos(o);if(kind==='ventry')initFotos(o,true);
}
function closeForm(){$('#pane').hidden=true;editing=null;pendingFoto=null;stopMic();ff={keep:[],nuevos:[],quitar:[]};fotoLeer=k=>fotoGet(k)}

$('#frm').addEventListener('change',e=>{if(e.target.id==='fFotoIn'){const fs=Array.from(e.target.files||[]);e.target.value='';agregarFotos(fs)}});
$('#frm').addEventListener('input',e=>{const t=e.target;
  if(t.id==='fGrupo'){$('#fGrupoNuevo').hidden=t.value!=='__nuevo';if(t.value==='__nuevo')$('#fGrupoNuevo input').focus()}
  if(t.id==='fMonto'){const n=digits(t.value);t.value=n?n.toLocaleString('es-CO'):''}
  if((t.id==='fMonto'||t.id==='fAnt')&&$('#fAntV'))$('#fAntV').value=money(digits($('#fMonto').value)*(+$('#fAnt').value||0)/100);
  if((t.id==='fMonto'||t.id==='fUtil')&&$('#fUtilV'))$('#fUtilV').value=money(digits($('#fMonto').value)*(+$('#fUtil').value||0)/100);
  if(t.name==='tipo'){$('#fCat').innerHTML=opts(t.value==='Ingreso'?CAT_I:CAT_G)}
  if(t.id==='fEstado'){const x=ESTADOS.find(z=>z[0]===t.value);if(x)$('#fProb').value=x[1]}});
$('#frm').addEventListener('click',e=>{if(e.target.closest('#micBtn')){toggleMic();return}
  const fx=e.target.closest('[data-quitar]');if(fx){quitarFoto(fx.dataset.quitar);return}const fv=e.target.closest('[data-ver]');if(fv){verFoto(fv.dataset.ver);return}if(e.target.id!=='fDel'||!editing)return;const {kind,o}=editing;
  if(kind==='diario'){const d=cfg().diario;closeForm();if(d)conGoogle(async()=>{try{await gApi('DELETE','/'+encodeURIComponent(d.id));const c={...cfg()};delete c.diario;put({...c,id:'config',kind:'config'});toast('Recordatorio diario eliminado')}catch(err){gErr(err)}});return}
  if(!o)return;
  if(kind==='recordar'){const {pid,r}=o;closeForm();conGoogle(async()=>{try{await gApi('DELETE','/'+encodeURIComponent(r.id));const x=items.get(pid);if(x)put({...x,recs:(x.recs||[]).filter(y=>y.id!==r.id)});toast('Recordatorio eliminado de Google Calendar')}catch(err){gErr(err)}});return}
  if(kind==='ventry'){if(!vault)return;vault.entries=vault.entries.filter(x=>x.id!==o.id);closeForm();renderVault();vSave();toast('Nota eliminada',()=>{if(vault){vault.entries.unshift(o);renderVault();vSave()}});return}
  if(kind==='grupo')$('#grupoV').hidden=true;
  closeForm();del(o.id);if(o.recs?.length)borrarRecs(o,false);toast(kind==='grupo'?'Grupo eliminado (sus gastos quedan sin grupo)':kind==='mov'?'Movimiento eliminado':kind==='cli'?'Cotización eliminada':'Contrato eliminado',()=>put(o))});
$('#frm').addEventListener('submit',e=>{e.preventDefault();if(!editing)return;
  const fd=Object.fromEntries(new FormData($('#frm'))),{kind,o}=editing,bad=m=>{const x=$('#fErr');x.textContent=m;x.hidden=false};
  if(kind==='grupo'){if(!fd.nombre.trim())return bad('Escribe el nombre del grupo.');
    const g={id:o?.id||newId('g'),kind:'grupo',nombre:fd.nombre.trim(),descripcion:fd.descripcion.trim(),presupuesto:digits(fd.presupuesto),cerrado:fd.cerrado==='si',creado:o?.creado||new Date().toISOString()};
    g.fotos=guardarFotos(g.id);closeForm();put(g);toast('Grupo guardado');if(!o)abrirGrupo(g.id);return}
  if(kind==='gcfg'){const v=(fd.gcid||'').trim();if(v&&!/\.apps\.googleusercontent\.com$/.test(v))return bad('El ID debe terminar en .apps.googleusercontent.com');
    gClient=null;gTok=null;try{sessionStorage.removeItem('gtok')}catch(err){}
    closeForm();put({...cfg(),id:'config',kind:'config',gcid:v});if(v){gLoad().then(gInit).catch(()=>{});toast('Guardado. Ahora toca “Google Calendar” para conectar')}else toast('Conexión quitada');return}
  if(kind==='recordar'){const x=o||pre_,par=items.get(x.pid);if(!par){closeForm();return}
    if(!fd.texto.trim())return bad('Escribe qué te recuerdo.');if(!fd.fecha||!fd.hora)return bad('Pon el día y la hora.');
    const body=evBody(fd.texto.trim(),fd.fecha,fd.hora,recDesc(par),false),old=o?.r;closeForm();
    conGoogle(async()=>{try{const ev=old?await gApi('PATCH','/'+encodeURIComponent(old.id),body):await gApi('POST','',body);
      const nr={id:ev.id,fecha:fd.fecha,hora:fd.hora,texto:fd.texto.trim()},act=items.get(x.pid)||par;
      put({...act,recs:[...(act.recs||[]).filter(y=>y.id!==(old?.id||ev.id)),nr]});toast('Listo: quedó en tu Google Calendar')}catch(err){gErr(err)}});return}
  if(kind==='diario'){if(!fd.hora)return bad('Elige la hora.');const d=cfg().diario,body=evBody('Anota los gastos de hoy',today(),fd.hora,'Abre Mis finanzas y anota lo que gastaste hoy.',true);closeForm();
    conGoogle(async()=>{try{const ev=d?await gApi('PATCH','/'+encodeURIComponent(d.id),body):await gApi('POST','',body);put({...cfg(),id:'config',kind:'config',diario:{id:ev.id,hora:fd.hora}});toast('Te recordaré todos los días a las '+fd.hora)}catch(err){gErr(err)}});return}
  if(kind==='dictar'){const t=(fd.texto||'').trim();if(!t)return bad('Dicta o escribe qué gastaste, qué te pagaron o a quién le cotizaste.');
    stopMic();const r=entender(t);if(r.kind==='cli')openForm('cli',null,null,r);else openForm('mov',null,null,r);
    toast(r.monto||r.valor?'Revisa y dale Guardar':'No entendí el monto: escríbelo');return}
  if(kind==='vsetup'||kind==='vchange'){
    if((fd.p1||'').length<4)return bad('Usa al menos 4 caracteres.');if(fd.p1!==fd.p2)return bad('Las dos no coinciden.');
    if(!window.crypto||!crypto.subtle)return bad('Este navegador no permite cifrar el baúl.');
    const salt=crypto.getRandomValues(new Uint8Array(16)),ents=vault?vault.entries:[];
    const viejo=vault?vault.key:null;
    vKey(fd.p1,salt).then(async key=>{if(viejo){for(const en of ents)for(const k of (en.fotos||[])){const b=await vFotoGet(k,viejo);if(b)await vFotoPut(k,b,key)}}
      vault={key,salt,entries:ents};closeForm();await vSave();openVault();toast('Palabra secreta guardada')});return}
  if(kind==='ventry'){if(!vault){closeForm();return}if(!fd.titulo.trim())return bad('Escribe un título.');
    const ve={id:o?.id||newId('v'),titulo:fd.titulo.trim(),monto:digits(fd.monto),nota:fd.nota.trim(),fecha:o?.fecha||today()};
    const keys=[...ff.keep],nuevos=ff.nuevos,quitar=ff.quitar,base=Date.now().toString(36);
    nuevos.forEach((b,i)=>{const k='v:'+ve.id+':'+base+i;keys.push(k);vFotoPut(k,b,vault.key).catch(()=>toast('No se pudo guardar una foto'))});quitar.forEach(k=>fotoDel(k));ve.fotos=keys;
    const i=vault.entries.findIndex(x=>x.id===ve.id);if(i>=0)vault.entries[i]=ve;else vault.entries.unshift(ve);closeForm();renderVault();vSave();return}
  let rec;
  if(kind==='mov'){const monto=digits(fd.monto);if(!monto)return bad('Escribe cuánto fue.');if(!fd.fecha)return bad('Elige la fecha.');
    let grupo=fd.grupo||'';if(grupo==='__nuevo'){const nn=(fd.grupoNuevo||'').trim();if(!nn)return bad('Escribe el nombre del grupo nuevo.');const g={id:newId('g'),kind:'grupo',nombre:nn,descripcion:'',presupuesto:0,cerrado:false,creado:new Date().toISOString()};put(g);grupo=g.id}
    rec={id:o?.id||newId('m'),kind:'mov',tipo:fd.tipo,monto,fecha:fd.fecha,categoria:fd.categoria,descripcion:fd.descripcion.trim(),metodo:fd.metodo,proyecto:fd.proyecto||'',grupo,creado:o?.creado||new Date().toISOString()};
    rec.fotos=guardarFotos(rec.id);
    const d=new Date(fd.fecha+'T12:00');cur=new Date(d.getFullYear(),d.getMonth(),1);
  }else if(kind==='proy'){const valor=digits(fd.valor);if(!fd.nombre.trim())return bad('Escribe el nombre.');if(!valor)return bad('Escribe el valor del contrato.');
    rec={id:o?.id||newId('p'),kind:'proy',nombre:fd.nombre.trim(),objeto:fd.objeto.trim(),cliente:fd.cliente.trim(),empresa:fd.empresa,tipoP:fd.tipoP,valor,estado:fd.estado,prob:Math.max(0,Math.min(100,+fd.prob||0)),util:Math.max(0,Math.min(100,+fd.util||0)),ant:Math.max(0,Math.min(100,+fd.ant||0)),antRec:fd.antRec||'',inicio:fd.inicio||'',meses:+fd.meses||0,notas:fd.notas.trim(),creado:o?.creado||new Date().toISOString()};
  }else if(kind==='cli'){if(!fd.cliente.trim())return bad('Escribe el nombre del cliente.');if(!fd.enviada)return bad('Pon la fecha en que se envió.');
    const cerr=!ABIERTA.includes(fd.estado);
    rec={id:o?.id||newId('c'),kind:'cli',cliente:fd.cliente.trim(),tel:fd.tel.trim(),que:fd.que.trim(),valor:digits(fd.valor),ant:Math.max(0,Math.min(100,+fd.ant||0)),enviada:fd.enviada,empresa:fd.empresa,estado:fd.estado,ultimo:fd.ultimo||'',notas:fd.notas.trim(),cerrada:cerr?(o?.cerrada||today()):'',creado:o?.creado||new Date().toISOString()};
  }else rec={...cfg(),id:'config',kind:'config',presupuesto:digits(fd.presupuesto)};
  if((kind==='cli'||kind==='proy')&&o?.recs)rec.recs=o.recs;
  const cerro=rec.recs?.length&&((kind==='cli'&&!ABIERTA.includes(rec.estado))||(kind==='proy'&&!ACTIVOS.includes(rec.estado)));
  closeForm();put(rec);toast('Guardado');if(cerro)borrarRecs(rec,true)});

const csvCell=v=>{const s=String(v??'');return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
async function copyCsv(rows,label){try{await navigator.clipboard.writeText(rows.map(r=>r.map(csvCell).join(';')).join('\n'));toast(label+' copiados: pégalos en Excel')}catch(e){toast('No se pudo copiar en este navegador')}}
const onAct=e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='addGrupo')openForm('grupo');if(a==='verGrupo')abrirGrupo(b.dataset.id);if(a==='editGrupo')openForm('grupo',items.get(grupoAbierto));
  if(a==='addGG'){const g=items.get(grupoAbierto);openForm('mov',null,null,{tipo:'Gasto',grupo:grupoAbierto,fecha:today(),categoria:/obra|construc|casa|remodel/.test(norm(g?.nombre||''))?'Obra y construcción':undefined})}if(a==='verFoto')verFoto(b.dataset.key);
  if(a==='addG')openForm('mov',null,'Gasto');if(a==='addI')openForm('mov',null,'Ingreso');if(a==='addP')openForm('proy');if(a==='budget')openForm('budget');
  if(a==='dictar'){openForm('dictar')}
  if(a==='addC')openForm('cli');if(a==='editC')openForm('cli',items.get(b.dataset.id));
  if(a==='antP'){const p=items.get(b.dataset.id);if(p){put({...p,antRec:today()});toast('Anticipo recibido hoy',()=>put(p))}}
  if(a==='segC'){const c=items.get(b.dataset.id);if(c){put({...c,ultimo:today()});toast('Seguimiento anotado: hoy')}}
  if(a==='addR'){const x=items.get(b.dataset.pid);if(x)openForm('recordar',null,null,{pid:x.id,texto:recTexto(x),fecha:masDias(3),hora:'09:00'})}
  if(a==='editR'){const x=items.get(b.dataset.pid),r=x&&(x.recs||[]).find(y=>y.id===b.dataset.rid);if(r)openForm('recordar',{pid:x.id,r,texto:r.texto,fecha:r.fecha,hora:r.hora})}
  if(a==='gcfg')openForm('gcfg');if(a==='diario')openForm('diario');if(a==='gConectar')conGoogle(()=>{toast('Google Calendar conectado');render()});
  if(a==='winC'){const c=items.get(b.dataset.id);if(c){const cc={...c,estado:'Aceptó',cerrada:today()};put(cc);if(cc.recs?.length)borrarRecs(cc,true);

function categoriaDe(t,ing){t=norm(t);for(const [c,r] of ing?KWI:KW)if(r.test(t))return c;return ing?'Otros ingresos':'Otros gastos'}
function descr(texto){let x=' '+texto+' ';
  x=x.replace(/\$?\s?\d[\d.,]*\s*(?:millones|millón|millon|palos?|mil|pesos)?(?:\s*(?:y\s*)?\d[\d.,]*\s*mil)?(?:\s*(?:de\s+)?pesos)?/gi,' ');
  x=x.replace(/\b(?:un|medio)\s+(?:millón|millon|palo)\b/gi,' ');
  x=x.replace(/\b(?:hoy|ayer|antier|anteayer|el\s+(?:lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo))\b/gi,' ');
  x=x.replace(/\b(?:con|en|por|de|desde)\s+(?:la\s+|el\s+)?(?:nequi|daviplata|efectivo|transferencia|tarjeta(?:\s+de\s+(?:cr[eé]dito|d[eé]bito))?|cr[eé]dito|d[eé]bito)\b/gi,' ');
  x=x.replace(/^\s*(?:yo\s+)?(?:me\s+)?(?:gast[eé]|pagu[eé]|compr[eé]|pagaron|recib[ií]|cobr[eé]|consignaron|transfirieron|entraron|entr[oó])(?=\s|$)/i,' ');
  x=x.replace(/\s+/g,' ').trim().replace(/^(?:en|de|del|por|para|un|una|unos|unas)\s+/i,'').replace(/\s+(?:en|de|del|por|para|con|y)$/i,'').trim();
  return x?x.charAt(0).toUpperCase()+x.slice(1):''}
function entender(texto){const t=norm(texto),cap1=x=>x?x.charAt(0).toUpperCase()+x.slice(1):'';
  if(/cotiz|cotic/.test(t)){let m=texto.match(/(?:cotizaci[oó]n|cotic[eé])\s+(?:a\s+la|al|a|para\s+el|para\s+la|para)\s+(.+?)(?=\s+por\s|\s+de\s+\$?\d|\s+para\s|,|\.|$)/i);
    let q=texto.match(/\d[\d.,]*\s*(?:millones|millón|millon|mil|palos?)?\s*(?:de pesos|pesos)?\s+(?:para|de)\s+(.+)$/i);
    return {kind:'cli',cliente:cap1(m?m[1].trim():''),que:cap1(q?q[1].trim().replace(/[.]$/,''):texto.trim()),valor:montoDe(texto),enviada:fechaDe(texto),estado:'Esperando respuesta'}}
  const ing=/me pagaron|me pago|recibi|cobre|ingreso|me entr|entraron|me consignaron|me transfirieron|honorario|me abonaron|me giraron/.test(t);
  return {kind:'mov',grupo:grupoDe(texto),tipo:ing?'Ingreso':'Gasto',monto:montoDe(texto),fecha:fechaDe(texto),metodo:metodoDe(texto),categoria:categoriaDe(texto,ing),descripcion:(descr(texto)||cap1(texto.trim())).slice(0,120)}}
/* fotos guardadas en el celular (IndexedDB) */
let idbP=null;
const idb=()=>idbP||(idbP=new Promise((ok,ko)=>{const r=indexedDB.open('finanzas-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}));
async function fotoPut(id,blob){const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(blob,id);t.oncomplete=ok;t.onerror=()=>ko(t.error)})}
async function fotoGet(id){try{const d=await idb();return await new Promise(ok=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}catch(e){return null}}
function achicar(file,max,q,gris){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');if(gris)x.filter='grayscale(1) contrast(1.4)';x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error('foto')),'image/jpeg',q)};
  im.onerror=()=>ko(new Error('foto'));im.src=u})}
const cargarJs=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.append(s)});
function leerTextoFactura(txt){
  const L=txt.split(/\n/).map(l=>l.trim()).filter(Boolean),nn=l=>(l.match(/\$?\s?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|\$?\s?\d{4,}(?:[.,]\d{2})?/g)||[]).map(x=>{x=x.replace(/[$\s]/g,'');const m=x.match(/^(.*?)[.,](\d{2})$/);if(m&&(/[.,]/.test(m[1])||m[1].length>=4))x=m[1];return +x.replace(/[.,]/g,'')}).filter(n=>n>=100&&n<1e9);
  const malo=/nit|tel|cel|resol|autoriz|factura\s*(no|n°|#)|cufe|codigo|c[oó]d\.?|nro|cc\b/i;
  let total=0;for(let i=L.length-1;i>=0&&!total;i--){if(/total/i.test(L[i])&&!/sub\s*-?\s*total|total\s*(items|art|unid|cant)/i.test(L[i])){let a=nn(L[i]);if(!a.length&&i+1<L.length)a=nn(L[i+1]);if(a.length)total=Math.max(...a)}}
  if(!total){const a=L.filter(l=>!malo.test(l)).flatMap(nn);if(a.length)total=Math.max(...a)}
  let fecha=today(),m=txt.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/),m2=txt.match(/\b(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/);
  if(m2&&+m2[2]<=12)fecha=m2[1]+'-'+pad(+m2[2])+'-'+pad(+m2[3]);else if(m&&+m[2]<=12&&+m[1]<=31)fecha=(m[3].length===2?'20'+m[3]:m[3])+'-'+pad(+m[2])+'-'+pad(+m[1]);
  if(fecha>today())fecha=today();
  const tienda=(L.find(l=>/[a-zñ]{3,}/i.test(l)&&!malo.test(l)&&!/fecha|hora|caja|cliente|direcc|regimen|iva/i.test(l))||'').replace(/[^\wÁÉÍÓÚÑáéíóúñ .&-]/g,'').trim();
  const desc=tienda?tienda.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()).slice(0,60):'Factura';
  const ct=categoriaDe(tienda,false);
  return {tipo:'Gasto',monto:total,fecha,categoria:ct!=='Otros gastos'?ct:categoriaDe(txt,false),descripcion:desc,metodo:/nequi|daviplata/i.test(txt)?'Nequi / Daviplata':/tarjeta|visa|mastercard|datafono|dat[aá]fono|redeban|credibanco/i.test(txt)?'Tarjeta débito':'Efectivo'}}

async function leerFactura(file){
  editing=null;$('#pTit').textContent='Leyendo la factura';$('#frm').innerHTML=`<div class="cargando">${ico('camara')}<span id="ocrTx">Preparando…</span></div><p class="nota">La primera vez el celular descarga el lector de facturas (unos 5 MB). Después es más rápido.</p>`;$('#pane').hidden=false;
  let foto;try{foto=await achicar(file,1200,.7,false)}catch(e){closeForm();toast('No pude abrir esa foto');return}
  let pre={tipo:'Gasto',descripcion:'Factura',fecha:today()};
  try{if(!window.Tesseract)await cargarJs('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const img=await achicar(file,1800,.9,true);
    const r=await Tesseract.recognize(img,'spa',{logger:m=>{const t=$('#ocrTx');if(t&&m.status)t.textContent=(m.status==='recognizing text'?'Leyendo… ':'Preparando… ')+Math.round((m.progress||0)*100)+'%'}});
    pre=leerTextoFactura(r.data.text||'')}catch(e){toast('No pude leer el texto: llena los datos a mano')}
  if($('#pane').hidden)return;
  pendingFoto=foto;const pf=foto;openForm('mov',null,null,pre);pendingFoto=pf;
  toast(pre.monto?'Revisa el total y dale Guardar':'No encontré el total: escríbelo')}

/* ---------- baúl: cifrado con la palabra secreta (AES-GCM, clave PBKDF2); se abre escribiéndola en el buscador + Enter ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let t='';for(let i=0;i<u.length;i++)t+=String.fromCharCode(u[i]);return btoa(t)};
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
let vault=null,vTimer=0;
async function vKey(pass,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pass.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vSave(){if(!vault)return;const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},vault.key,enc.encode(JSON.stringify(vault.entries)));
  await put({id:'vault',kind:'vault',salt:b64(vault.salt),iv:b64(iv),ct:b64(ct)})}
async function vTry(pass){const d=items.get('vault');if(!d||!window.crypto||!crypto.subtle)return false;
  try{const salt=ub64(d.salt),key=await vKey(pass,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.iv)},key,ub64(d.ct));
    vault={key,salt,entries:JSON.parse(dec.decode(pt))};return true}catch(e){return false}}
async function vFotoPut(k,blob,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,await blob.arrayBuffer());
  const out=new Uint8Array(12+ct.byteLength);out.set(iv);out.set(new Uint8Array(ct),12);return fotoPut(k,new Blob([out]))}
async function vFotoGet(k,key){key=key||vault?.key;if(!key)return null;const b=await fotoGet(k);if(!b)return null;
  try{const u=new Uint8Array(await b.arrayBuffer());const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));return new Blob([pt],{type:'image/jpeg'})}catch(e){return null}}
function renderVault(){if(!vault)return;const es=vault.entries,tot=es.reduce((a,x)=>a+(x.monto||0),0);
  $('#vSum').textContent=es.length?es.length+(es.length===1?' nota':' notas')+(tot?' · suman '+money(tot):''):'Vacío';
  $('#vList').innerHTML=es.length?es.map(x=>`<button class="tarjeta fila" data-id="${esc(x.id)}"><div><div class="t-nom">${esc(x.titulo)}</div><div class="t-txt" style="color:var(--muted)">${esc(x.nota)}</div>${(x.fotos||[]).length?`<div class="t-sub"><span class="chipf">${ico('camara')}${x.fotos.length}</span></div>`:''}</div><div class="monto">${x.monto?esc(money(x.monto)):''}</div></button>`).join('')
    :vacio('Guarda aquí lo que no quieres que se vea en la app: ahorros, deudas, notas privadas.');vPing()}
function vPing(){clearTimeout(vTimer);vTimer=setTimeout(closeVault,5*60*1000)}
function openVault(){$('#vault').hidden=false;renderVault()}
function closeVault(){clearTimeout(vTimer);if(editing&&['ventry','vchange'].includes(editing.kind))closeForm();vault=null;$('#vault').hidden=true;$('#vList').innerHTML='';$('#vSum').textContent=''}
$('#vIco').innerHTML=ico('llave');$('#gBack').innerHTML=ico('atras');$('#vAddIc').innerHTML=ico('nota');$('#vChgIc').innerHTML=ico('llave');$('#hIco').innerHTML=ico('plata');$('#pBack').innerHTML=ico('atras');
$('#vClose').addEventListener('click',closeVault);
$('#vAdd').addEventListener('click',()=>{vPing();openForm('ventry')});
$('#vChg').addEventListener('click',()=>{vPing();openForm('vchange')});
$('#vList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b&&vault){vPing();openForm('ventry',vault.entries.find(x=>x.id===b.dataset.id))}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&vault)closeVault()});
$('#main').addEventListener('keydown',async e=>{if(e.target.id!=='q'||e.key!=='Enter')return;e.preventDefault();const v=e.target.value;
  if(!items.get('vault')){if(['baul','baúl'].includes(v.trim().toLowerCase())){q='';e.target.value='';$('#movList').innerHTML=listaMovs(mes().movs);e.target.blur();openForm('vsetup')}return}
  if(v.length<4)return;
  if(await vTry(v)){q='';e.target.value='';e.target.blur();$('#movList').innerHTML=listaMovs(mes().movs);openVault()}});

window.addEventListener('hashchange',route);
loadLocal();route();setStatus('local');
if(gid())gLoad().then(gInit).catch(()=>{});
(async()=>{
  if(!window.claude||!claude.use)return;
  try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);const id=user?await user.id():null;if(!db||!id)return;
    $('#sync').className='sync off';$('#sync').textContent='Conectando con tu cuenta…';
    coll=db.collection('data/users/'+id);const t=setTimeout(()=>setStatus('slow'),10000);
    coll.onSnapshot(s=>{const m=new Map();s.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,{...v,id:d.id})});items=m;
      if(!s.metadata.fromCache){clearTimeout(t);setStatus('db')}render()},()=>{clearTimeout(t);setStatus('err')});
  }catch(e){}
})();
}
